spring:
  application:
    name: jewelry-workshop-api

  datasource:
    url: jdbc:postgresql://localhost:5432/jewelry_workshop
    username: postgres
    password: 197326
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.jewelry.workshop: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # Исправлено опечатку

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: 3cfa76ef14937c1c0e821b1c1526e7d5e7a9f3d4e2b8a1c7d6e9f0a3b5c8d2e1
    expiration: 900000      # 15 минут
    refresh:
      expiration: 604800000 # 7 дней